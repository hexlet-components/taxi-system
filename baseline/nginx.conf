worker_processes 1;
events { worker_connections 256; }
http {
    access_log off;
    upstream taxi { server app:8080; server app2:8080; }
    server {
        listen 8080;
        location /summary { proxy_pass http://summary:8080; }
        location /deliveries/ { proxy_pass http://notifications:8080; }
        location / {
            proxy_pass http://taxi;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3s;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
