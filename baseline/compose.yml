x-postgres: &postgres
  image: postgres:18
  environment:
    POSTGRES_DB: taxi
    POSTGRES_HOST_AUTH_METHOD: trust
  healthcheck:
    test: [CMD-SHELL, pg_isready -h 127.0.0.1 -U postgres -d taxi]
    interval: 1s
    timeout: 2s
    retries: 60
x-code: &code
  image: taxi-baseline:local
  build:
    context: ..
    dockerfile: baseline/Dockerfile
  init: true
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 2s
    timeout: 3s
    retries: 40
x-main-env: &main-env
  DATABASE_URL: postgres://postgres@db:5432/taxi
x-view-env: &view-env
  DATABASE_URL: postgres://postgres@summary-db:5432/taxi
services:
  db:
    <<: *postgres
    image: imresamu/postgis:18-3.6-alpine
    command: [postgres, -c, wal_level=logical]
    volumes:
      - main:/var/lib/postgresql
      - ../monolith/db:/source:ro
      - ./db:/baseline:ro
      - ./db/main.sql:/docker-entrypoint-initdb.d/01.sql:ro
  replica:
    <<: *postgres
    image: imresamu/postgis:18-3.6-alpine
    volumes:
      - replica:/var/lib/postgresql
      - ../monolith/db:/source:ro
      - ./db:/baseline:ro
      - ./db/replica.sql:/docker-entrypoint-initdb.d/01.sql:ro
    depends_on:
      db: {condition: service_healthy}
  summary-db:
    <<: *postgres
    volumes:
      - summary:/var/lib/postgresql
      - ./db/summary.sql:/docker-entrypoint-initdb.d/01.sql:ro
  notifications-db:
    <<: *postgres
    volumes:
      - notifications:/var/lib/postgresql
      - ./db/notifications.sql:/docker-entrypoint-initdb.d/01.sql:ro
  kafka:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka:/var/lib/kafka/data]
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:9092, --list]
      interval: 4s
      timeout: 10s
      retries: 40
  topic:
    <<: *code
    environment: {ROLE: topic}
    depends_on:
      kafka: {condition: service_healthy}
  app: &app
    <<: *code
    command: [node, monolith/src/index.ts]
    environment:
      <<: *main-env
      REPLICA_URL: postgres://postgres@replica:5432/taxi
      NOTIFICATIONS_URL: ""
      READ_HISTORY_FROM_REPLICA: "true"
      MAX_INFLIGHT: 20
      POOL_TIMEOUT_MS: 500
      STATEMENT_TIMEOUT_MS: 1500
      INSTANCE: app
    depends_on:
      db: {condition: service_healthy}
      replica: {condition: service_healthy}
  app2:
    <<: *app
    environment:
      <<: *main-env
      REPLICA_URL: postgres://postgres@replica:5432/taxi
      NOTIFICATIONS_URL: ""
      READ_HISTORY_FROM_REPLICA: "true"
      MAX_INFLIGHT: 20
      POOL_TIMEOUT_MS: 500
      STATEMENT_TIMEOUT_MS: 1500
      INSTANCE: app2
  publisher:
    <<: *code
    restart: unless-stopped
    environment: {<<: *main-env, ROLE: publisher}
    depends_on:
      db: {condition: service_healthy}
      topic: {condition: service_completed_successfully}
  consumer:
    <<: *code
    restart: unless-stopped
    environment: {<<: *view-env, ROLE: consumer}
    depends_on:
      summary-db: {condition: service_healthy}
      topic: {condition: service_completed_successfully}
  summary:
    <<: *code
    environment: {<<: *view-env, ROLE: summary}
    depends_on:
      summary-db: {condition: service_healthy}
  notifications:
    <<: *code
    environment:
      DATABASE_URL: postgres://postgres@notifications-db:5432/taxi
      ROLE: notifications
    depends_on:
      notifications-db: {condition: service_healthy}
  notification-worker:
    <<: *code
    restart: unless-stopped
    environment: {<<: *main-env, ROLE: notification-worker}
    depends_on:
      db: {condition: service_healthy}
      notifications: {condition: service_healthy}
  nginx:
    image: nginx:1-alpine
    ports: ["127.0.0.1:${WEB_PORT:-8082}:8080"]
    volumes: [./nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on:
      app: {condition: service_healthy}
      app2: {condition: service_healthy}
      summary: {condition: service_healthy}
      notifications: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  main:
  replica:
  summary:
  notifications:
  kafka:
