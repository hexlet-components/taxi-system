---
services:
  db:
    image: imresamu/postgis:18-3.6-alpine
    command: postgres -c pg_stat_statements.track=all -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_DB: taxi
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/primary-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taxi || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 40
      start_period: 10s

  app: &app
    build:
      context: .
    volumes:
      - .:/app
    command: make start
    env_file:
      - ./service.env
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres@db:5432/taxi
      INSTANCE: app
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    depends_on:
      db:
        condition: service_healthy

  app2:
    <<: *app
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres@db:5432/taxi
      INSTANCE: app2

  nginx:
    image: nginx:1-alpine
    # nginx резолвит имена upstream один раз при старте и падает, если
    # экземпляр ещё не поднялся, поэтому балансировщик перезапускается.
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_started
      app2:
        condition: service_started

  k6:
    profiles: ["load"]
    image: grafana/k6:latest
    volumes:
      - ./load:/load
      - ./reports:/reports
    working_dir: /load
    environment:
      TARGET_URL: http://nginx:8080

volumes:
  pgdata:
