# Балансировщик перед двумя экземплярами API. Экземпляры описаны отдельными
# сервисами compose, поэтому имена резолвятся один раз при старте и
# перезапуск экземпляра не требует перечитывания конфигурации.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy_temp;

    upstream taxi_api {
        # HTTP 503 означает и управляемый слив, и отказ по перегрузке. Nginx
        # пробует второй экземпляр, но не помечает оба адреса недоступными:
        # иначе следующий запрос получил бы 502 от пустой группы upstream.
        server app:8080 max_fails=0;
        server app2:8080 max_fails=0;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://taxi_api;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
