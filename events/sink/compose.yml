name: sd-stream-sink
services:
  kafka:
    image: apache/kafka:4.2.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:9092, --list]
      interval: 5s
      timeout: 10s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:25.3.9.72
    environment:
      CLICKHOUSE_PASSWORD: lesson
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [CMD, clickhouse-client, --password, lesson, --query, SELECT 1]
      interval: 5s
      timeout: 5s
      retries: 20
  publisher:
    image: maven:3.9-eclipse-temurin-21
    profiles: [tools]
    working_dir: /work
    volumes:
      - .:/work
      - maven-cache:/root/.m2
    command: [mvn, -q, compile, exec:java, -Dexec.args=trips.ndjson]
    depends_on:
      kafka:
        condition: service_healthy
volumes:
  maven-cache:
