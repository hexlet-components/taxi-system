name: events-postgres
services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student-local
      POSTGRES_DB: streaming
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d streaming"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql
volumes:
  postgres-data:
